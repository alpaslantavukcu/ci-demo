[project]
name = "ci-demo"
version = "0.1.0"
description = "Tiny project for a GitHub Actions CI/CD demo"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E = pycodestyle, F = pyflakes, I = import sorting, B = bugbear
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
