name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: jobs can only read the repository.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-useless run.
# Runs on main are never cancelled, so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=calculator --cov-report=term-missing --cov-report=html
      - name: Upload coverage report (one matrix leg only)
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7

  deploy-report:
    # CD: runs only after every test leg passed, and only on pushes to main
    # (that is, after a pull request has been merged).
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build the coverage site
        run: pytest --cov=calculator --cov-report=html
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: htmlcov/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
